version: "3.9"

services:
  db:
    image: postgres:15
    container_name: sensors-db
    environment:
      POSTGRES_DB: sensors
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./migrations:/migrations

  app:
    build: .
    container_name: sensors-app
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: sensors
      DB_USER: user
      DB_PASSWORD: password
    volumes:
          - ./migrations:/migrations

